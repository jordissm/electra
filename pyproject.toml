[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electra"
version = "0.1.0"
description = "ELECTRA: eHIJING → SMASH orchestration CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
electra = "electra.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
