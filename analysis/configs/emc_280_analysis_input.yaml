version: 1
name: EMC_280
description: Supplied 280 GeV table cuts; illustrative bins, no angular acceptance.
beam: {energy: 280, mass: 0.1056583755, direction: -z}
frame: TRF
species:
  charged: {charge: nonzero}
  positive: {charge: positive}
  negative: {charge: negative}
event_cuts:
  Q2: {min: 5.0}
  y: {max: 0.85}
  xB: {min: 0.02}
  nu: {min: 50.0}
hadron_cuts:
  p: {min: 5.0}
histograms:
  - name: zh
    axes:
      - {variable: zh, min: 0, max: 1, bins: 10, density: true}
  - name: zh_nu
    axes:
      - {variable: zh, min: 0, max: 1, bins: 10, density: true}
      - {variable: nu, edges: [50, 100, 150, 200, 238]}
