name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jordissm/electra

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          progress: plain
          tags: |
            ${{ env.IMAGE_NAME }}:amd64
          cache-from: type=gha,scope=electra-amd64
          cache-to: type=gha,mode=max,scope=electra-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          progress: plain
          tags: |
            ${{ env.IMAGE_NAME }}:arm64
          cache-from: type=gha,scope=electra-arm64
          cache-to: type=gha,mode=max,scope=electra-arm64

  manifest:
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t $IMAGE_NAME:latest \
            $IMAGE_NAME:amd64 \
            $IMAGE_NAME:arm64

      - name: Inspect multi-arch manifest
        run: |
          docker buildx imagetools inspect $IMAGE_NAME:latest