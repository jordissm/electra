name: Build documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read eHIJING documentation revision
        id: ehijing
        run: echo "revision=$(cat docs/ehijing-revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out eHIJING documentation and headers
        uses: actions/checkout@v6
        with:
          repository: jordissm/ehijing
          ref: ${{ steps.ehijing.outputs.revision }}
          path: src/ehijing
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz
          python -m pip install -r docs/requirements.txt
      - name: Build manual and API reference
        run: sphinx-build -t cpp-api -b html -W --keep-going docs docs/_build/html
      - name: Upload HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
